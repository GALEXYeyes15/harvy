[package]
name = "harvy"
version = "0.1.0"
description = "Harvy — a minimal writing app"
authors = ["you"]
edition = "2021"

[lib]
name = "harvy_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.10", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
base64 = "0.22"
dotenvy = "0.15"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
printpdf = { version = "0.7", features = ["embedded_images"] }
pulldown-cmark = "0.12"
regex = "1"
time = { version = "0.3", features = ["formatting"] }
image = { version = "0.24", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp", "tiff"] }

# Xcode 27's Swift package manager compiles iOS targets against the Mac SDK
# unless swift-rs passes an explicit triple. That fix is on swift-rs master,
# ahead of the 1.0.7 release Tauri currently pulls in.
[patch.crates-io]
swift-rs = { git = "https://github.com/Brendonovich/swift-rs", rev = "fd82965ee1a55b2777122a9ac42a581c613327ac" }

[target.'cfg(target_os = "ios")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSArray", "NSData", "NSDictionary", "NSError", "NSFileManager", "NSObject", "NSPathUtilities", "NSSet", "NSString", "NSURL"] }
objc2-ui-kit = { version = "0.3", features = ["UIApplication", "UIDocumentPickerViewController", "UIResponder", "UIScene", "UIViewController", "UIWindow", "UIWindowScene", "block2", "objc2-uniform-type-identifiers"] }
objc2-uniform-type-identifiers = { version = "0.3", features = ["UTType"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSURL", "NSAttributedString", "NSDictionary", "NSRange", "NSValue", "NSArray"] }
objc2-app-kit = { version = "0.3", features = ["NSColor", "NSColorSampler", "NSColorSpace", "NSPrintInfo", "NSPrintOperation", "NSFont", "NSFontDescriptor", "NSAttributedString", "NSApplication", "NSResponder", "NSView", "NSWindow", "NSSharingService"] }
objc2-pdf-kit = { version = "0.3", features = ["PDFDocument", "PDFPage", "objc2-app-kit"] }
block2 = "0.6"
