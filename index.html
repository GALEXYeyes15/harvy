<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Harvy</title>
    <script>
      (function () {
        try {
          var mode = localStorage.getItem("harvy-theme");
          var systemDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          var resolved =
            mode === "light" || mode === "dark" || mode === "cyber"
              ? mode
              : systemDark
                ? "dark"
                : "light";
          var root = document.documentElement;
          root.dataset.theme = resolved;
          root.classList.toggle("dark", resolved === "dark" || resolved === "cyber");
          root.classList.toggle("cyber", resolved === "cyber");
        } catch (_) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Inter:ital,opsz,wght@0,14..32,400..700;1,14..32,400..700&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
