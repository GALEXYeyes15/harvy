<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Harvy</title>
    <script>
      (function () {
        try {
          var theme = localStorage.getItem("harvy-theme");
          var style = localStorage.getItem("harvy-style") || "classic";
          if (theme === "cyber") {
            theme = "dark";
            if (!localStorage.getItem("harvy-style")) {
              style = "cyber";
              localStorage.setItem("harvy-style", "cyber");
            }
            localStorage.setItem("harvy-theme", "dark");
          }
          if (style === "default") style = "classic";
          var systemDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          var resolved =
            theme === "light" || theme === "dark" ? theme : systemDark ? "dark" : "light";
          var root = document.documentElement;
          root.dataset.theme = resolved;
          root.dataset.style = style;
          root.classList.toggle("dark", resolved === "dark");
          root.classList.toggle("cyber", style === "cyber");
        } catch (_) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Inter:ital,opsz,wght@0,14..32,400..700;1,14..32,400..700&family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;1,400&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=Space+Grotesk:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
